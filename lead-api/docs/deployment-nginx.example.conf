# Example ONLY — adapt hostname and port to approved VPS deployment.
# Certbot/Coolify must provision TLS certificate independently.
server {
  listen 443 ssl http2;
  server_name leads.khoshvisa.ir;

  # ssl_certificate /etc/letsencrypt/live/leads.khoshvisa.ir/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/leads.khoshvisa.ir/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  client_max_body_size 64k;

  location / {
    proxy_pass http://127.0.0.1:3084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering on;
  }
}
