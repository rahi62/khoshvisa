name: KhoshVisa Next.js Lead API checks
on:
  pull_request:
    branches: [static]
    paths:
      - "lead-api/**"
      - ".github/workflows/khoshvisa-leads-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lead-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
