name: Deploy KhoshVisa to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: khoshvisa-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/khoshvisa_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/khoshvisa_deploy ~/.ssh/known_hosts

      - name: Sync application files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='db.sqlite3' \
            -e "ssh -i ~/.ssh/khoshvisa_deploy -p ${VPS_PORT}" \
            ./ "${VPS_USER}@${VPS_HOST}:/var/www/khoshvisa/app/"

      - name: Build, migrate and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/khoshvisa_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          APP_ROOT=/var/www/khoshvisa
          SHARED_ROOT="$APP_ROOT/shared"
          BACKUP_DIR="$SHARED_ROOT/backups"
          BACKEND_ENV="$SHARED_ROOT/backend.env"
          FRONTEND_ENV="$SHARED_ROOT/frontend.env"
          CMS_ADMIN_ACTIVE="$SHARED_ROOT/cms-admin"
          CMS_ADMIN_BUILD="$SHARED_ROOT/cms-admin-build"
          CMS_ADMIN_PREVIOUS="$SHARED_ROOT/cms-admin-previous"

          rollback_cms_admin() {
            echo "CMS Admin activation failed; restoring previous release if available."
            sudo /usr/bin/systemctl stop khoshvisa-cms-admin.service || true
            rm -rf "$CMS_ADMIN_ACTIVE"
            if [ -d "$CMS_ADMIN_PREVIOUS" ]; then
              mv "$CMS_ADMIN_PREVIOUS" "$CMS_ADMIN_ACTIVE"
              sudo /usr/bin/systemctl restart khoshvisa-cms-admin.service || true
            fi
          }

          test -f "$BACKEND_ENV"
          test -f "$FRONTEND_ENV"
          mkdir -p "$BACKUP_DIR" "$SHARED_ROOT/media" "$SHARED_ROOT/static"

          if ! sudo /usr/bin/systemctl cat khoshvisa-cms-admin.service >/dev/null 2>&1; then
            echo "khoshvisa-cms-admin.service is not installed. Run deploy/install-cms-admin.sh on the VPS before deploying this release."
            exit 1
          fi

          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 20 || (major === 20 && minor < 9)) { console.error(`Node ${process.versions.node} is too old for CMS Admin; Node >=20.9 is required.`); process.exit(1); }'

          set -a
          . "$BACKEND_ENV"
          set +a

          pg_dump "$DATABASE_URL" | gzip > "$BACKUP_DIR/predeploy-$(date +%Y%m%d-%H%M%S).sql.gz"
          find "$BACKUP_DIR" -type f -name 'predeploy-*.sql.gz' -mtime +14 -delete

          python3 -m venv "$APP_ROOT/venv"
          "$APP_ROOT/venv/bin/pip" install --upgrade pip wheel
          "$APP_ROOT/venv/bin/pip" install -r "$APP_ROOT/app/backend/requirements.txt"

          cd "$APP_ROOT/app/backend"
          "$APP_ROOT/venv/bin/python" manage.py migrate --noinput
          "$APP_ROOT/venv/bin/python" manage.py check
          "$APP_ROOT/venv/bin/python" manage.py collectstatic --noinput
          sudo /usr/bin/systemctl restart khoshvisa-backend.service

          cd "$APP_ROOT/app/frontend"
          set -a
          . "$FRONTEND_ENV"
          set +a
          npm ci
          npm run build
          sudo /usr/bin/systemctl restart khoshvisa-frontend.service

          rm -rf "$CMS_ADMIN_BUILD"
          npx --yes @digitalafarin/cms-admin@0.4.1 scaffold \
            --dir "$CMS_ADMIN_BUILD" \
            --base-path /cms \
            --api-url https://api.khoshvisa.ir/api/cms/v1 \
            --port 3001 \
            --skip-install

          cd "$CMS_ADMIN_BUILD"
          npm install --no-audit --no-fund
          npm run build

          rm -rf "$CMS_ADMIN_PREVIOUS"
          if [ -d "$CMS_ADMIN_ACTIVE" ]; then
            mv "$CMS_ADMIN_ACTIVE" "$CMS_ADMIN_PREVIOUS"
          fi
          mv "$CMS_ADMIN_BUILD" "$CMS_ADMIN_ACTIVE"

          if ! sudo /usr/bin/systemctl restart khoshvisa-cms-admin.service; then
            rollback_cms_admin
            exit 1
          fi

          if ! sudo /usr/bin/systemctl is-active --quiet khoshvisa-cms-admin.service; then
            rollback_cms_admin
            exit 1
          fi

          if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:3001/cms/login >/dev/null; then
            rollback_cms_admin
            exit 1
          fi

          CMS_PROXY_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"username":"__cms_health__","password":"__cms_health__"}' \
            http://127.0.0.1:3001/cms/api-proxy/auth/token/)"
          case "$CMS_PROXY_STATUS" in
            400|401) ;;
            *)
              echo "Unexpected CMS API proxy health status: $CMS_PROXY_STATUS"
              rollback_cms_admin
              exit 1
              ;;
          esac

          rm -rf "$CMS_ADMIN_PREVIOUS"

          sudo /usr/bin/systemctl is-active khoshvisa-backend.service
          sudo /usr/bin/systemctl is-active khoshvisa-frontend.service
          sudo /usr/bin/systemctl is-active khoshvisa-cms-admin.service
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:8000/health/
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --head http://127.0.0.1:3000/
          REMOTE
