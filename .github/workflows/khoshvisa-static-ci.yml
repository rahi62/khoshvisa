name: KhoshVisa Static Build
on:
  push:
    branches:
      - feat/khoshvisa-cinematic-v2
      - static
  pull_request:
    branches:
      - static
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: static-site/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Static build
        run: npm run build
      - name: Verify exported routes
        run: |
          test -f out/index.html
          test -f out/destinations/index.html
          test -f out/visa-explorer/index.html
          test -f out/visa-readiness/index.html
          test -f out/motion-lab/index.html
          test -f out/schengen-visa/index.html
