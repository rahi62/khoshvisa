name: CMS Admin CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/cms-admin-v0.4]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Django system and migration checks
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck public frontend
        working-directory: frontend
        run: npx tsc --noEmit

  cms-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scaffold pinned CMS Admin
        run: |
          npx --yes @digitalafarin/cms-admin@0.4.0 scaffold \
            --dir .cms-admin-ci \
            --base-path /cms \
            --api-url http://127.0.0.1:8000/api/cms/v1 \
            --port 3001 \
            --skip-install
      - name: Install CMS Admin dependencies
        working-directory: .cms-admin-ci
        run: npm install --no-audit --no-fund
      - name: Typecheck CMS Admin
        working-directory: .cms-admin-ci
        run: npm run typecheck
      - name: Build CMS Admin
        working-directory: .cms-admin-ci
        run: npm run build
