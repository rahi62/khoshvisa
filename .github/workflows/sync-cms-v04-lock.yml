name: Sync CMS v0.4 Frontend Lockfile

on:
  push:
    branches:
      - feat/cms-admin-v0.4
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cms-admin-v0.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "frontend/package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: sync frontend lockfile for CMS 0.4"
          git push origin HEAD:feat/cms-admin-v0.4
